---
# Installs the SABC compliance detection agent (the custom lightweight
# detection plane that replaced the Wazuh agent).
#
# What it does:
#   1. Ensures python3 is present (raw bootstrap — works on minimal images).
#   2. Installs the `watchdog` library: distro package first, then a wheel
#      dropped in packages/detection-agent/ (airgap), then pip as last resort.
#   3. Copies agent.py, writes /etc/compliance-agent/config.yaml with the
#      gateway URL + API key injected from platform config, installs the
#      systemd unit, enables + starts the service and verifies it is active.
#
# Vars injected by InstallServiceUseCase:
#   detection_gateway_url     https://<platform>:8443/api/webhooks/detection
#   detection_api_key         shared X-API-Key value
#   detection_node_hostname   hostname the agent reports with (Node Registry name)
#   detection_agent_src       controller-side dir holding agent.py + unit file
#   packages_dir              controller packages dir (airgap wheels)
#
- name: Install SABC Compliance Detection Agent
  hosts: target
  become: yes
  gather_facts: no

  vars:
    agent_src: "{{ detection_agent_src }}"
    agent_dst: /usr/local/lib/compliance-agent
    conf_dir: /etc/compliance-agent
    unit_name: compliance-detection-agent
    wheel_dir: "{{ packages_dir }}/detection-agent"

  pre_tasks:
    # Minimal cloud images may ship without python3 — bootstrap over raw SSH.
    - name: Ensure python3 is available (raw SSH, no facts)
      raw: |
        if command -v python3 >/dev/null 2>&1; then echo "PY_OK"; exit 0; fi
        echo "BOOTSTRAP: installing python3" >&2
        if command -v apt-get >/dev/null 2>&1; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y && apt-get install -y python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3
        fi
        command -v python3 >/dev/null 2>&1 && echo "PY_OK" || { echo "no python3" >&2; exit 1; }
      register: py_bootstrap
      changed_when: "'installing python3' in (py_bootstrap.stderr | default(''))"

    - name: Gather facts now that python3 is available
      setup:

  tasks:
    # ── watchdog library ──────────────────────────────────────────────────────
    - name: Install watchdog from the distro repository
      package:
        name: python3-watchdog
        state: present
      register: watchdog_pkg
      failed_when: false

    - name: Check whether watchdog imports
      command: python3 -c "import watchdog"
      register: watchdog_import
      changed_when: false
      failed_when: false

    - name: Find offline watchdog wheels on the controller (airgap)
      find:
        paths: "{{ wheel_dir }}"
        patterns: "*.whl"
      register: watchdog_wheels
      delegate_to: localhost
      become: no
      failed_when: false
      when: watchdog_import.rc != 0

    - name: Install watchdog from bundled wheels (airgap)
      when:
        - watchdog_import.rc != 0
        - (watchdog_wheels.files | default([]) | length) > 0
      block:
        - name: Create wheel staging directory on the node
          file:
            path: /tmp/sabc-wheels
            state: directory
            mode: "0755"

        - name: Copy wheels to the node
          copy:
            src: "{{ item.path }}"
            dest: "/tmp/sabc-wheels/{{ item.path | basename }}"
            mode: "0644"
          loop: "{{ watchdog_wheels.files }}"

        - name: Install wheels with pip (no index)
          shell: python3 -m pip install --no-index --find-links /tmp/sabc-wheels watchdog
          register: wheel_install
          changed_when: "'Successfully installed' in (wheel_install.stdout | default(''))"

    - name: Re-check whether watchdog imports
      command: python3 -c "import watchdog"
      register: watchdog_import2
      changed_when: false
      failed_when: false

    - name: Install watchdog with pip (online fallback)
      shell: |
        python3 -m pip install watchdog 2>/dev/null \
          || python3 -m pip install --break-system-packages watchdog
      when: watchdog_import2.rc != 0
      register: pip_install
      changed_when: "'Successfully installed' in (pip_install.stdout | default(''))"

    - name: Verify watchdog is importable
      command: python3 -c "import watchdog; print(watchdog.__name__)"
      changed_when: false

    # ── Agent files ───────────────────────────────────────────────────────────
    - name: Create agent directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - "{{ agent_dst }}"
        - "{{ conf_dir }}"
        - /var/lib/compliance-agent
        - /var/spool/compliance-agent

    - name: Copy the detection agent
      copy:
        src: "{{ agent_src }}/agent.py"
        dest: "{{ agent_dst }}/agent.py"
        mode: "0755"
        owner: root
        group: root
      notify: Restart detection agent

    # The config carries the shared API key — root-only.
    - name: Write /etc/compliance-agent/config.yaml
      copy:
        dest: "{{ conf_dir }}/config.yaml"
        mode: "0600"
        owner: root
        group: root
        content: |
          # Managed by the SABC compliance platform (install_detection_agent.yml).
          node_hostname: {{ detection_node_hostname }}

          gateway:
            url: {{ detection_gateway_url }}
            api_key: {{ detection_api_key }}
            verify_tls: false

          watch:
            - /etc/ssh/
            - /etc/pam.d/
            - /etc/sudoers
            - /etc/sudoers.d/
            - /etc/passwd
            - /etc/group
            - /etc/shadow

          snapshot_policies:
            - path: /etc/shadow
              snapshot: hash-only

          debounce_seconds: 2
          heartbeat_interval_seconds: 600
          spool_dir: /var/spool/compliance-agent
          state_dir: /var/lib/compliance-agent
      notify: Restart detection agent

    - name: Install the systemd unit
      copy:
        src: "{{ agent_src }}/compliance-detection-agent.service"
        dest: "/etc/systemd/system/{{ unit_name }}.service"
        mode: "0644"
        owner: root
        group: root
      notify: Restart detection agent

    - name: Enable and start the detection agent
      systemd:
        name: "{{ unit_name }}"
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Flush handlers (apply restart before verifying)
      meta: flush_handlers

    # ── Verify ────────────────────────────────────────────────────────────────
    - name: Wait for the service to settle
      command: "systemctl is-active {{ unit_name }}"
      register: agent_active
      retries: 6
      delay: 5
      until: agent_active.stdout == 'active'
      changed_when: false
      failed_when: false

    - name: Show recent agent log on failure (diagnostic)
      command: "journalctl -u {{ unit_name }} -n 20 --no-pager"
      register: agent_log
      changed_when: false
      failed_when: false
      when: agent_active.stdout != 'active'

    - name: Abort — the detection agent did not start
      fail:
        msg: |
          {{ unit_name }} is not active on {{ ansible_facts['fqdn'] }}.
          Recent log:
          {{ agent_log.stdout | default('(no log)') }}
      when: agent_active.stdout != 'active'

    - name: Detection agent ready
      debug:
        msg: >-
          Compliance detection agent installed on {{ ansible_facts['fqdn'] }} and
          reporting to {{ detection_gateway_url }} as
          '{{ detection_node_hostname }}'. Watched paths: /etc/ssh/, /etc/pam.d/,
          /etc/sudoers*, /etc/passwd, /etc/group, /etc/shadow.

  handlers:
    - name: Restart detection agent
      systemd:
        name: "{{ unit_name }}"
        state: restarted
        daemon_reload: yes
